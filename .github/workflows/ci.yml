name: Manual site validation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/phase-1-editorial-site

permissions:
  contents: read

concurrency:
  group: trove-and-tier-manual-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Astro type and content checks
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Save static site output for direct Cloudflare upload
        uses: actions/upload-artifact@v4
        with:
          name: trove-and-tier-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
