name: Site checks

on:
  push:
    branches:
      - main
      - feat/phase-1-editorial-site
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Astro type and content checks
        run: npm run check
      - name: Build static site
        run: npm run build
